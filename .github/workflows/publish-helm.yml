name: Publish Helm Chart to GHCR

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.13.2"

      - name: Get latest release id
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_repo="${GITHUB_REPOSITORY}"
          api_url="https://api.github.com/repos/${owner_repo}/releases/latest"
          echo "Querying $api_url"
          release_id=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "$api_url" | jq -r '.id // empty')
          if [ -z "$release_id" ]; then
            echo "No release found; falling back to run id"
            release_id="${GITHUB_RUN_ID}"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Generate tag
        id: tag
        run: |
          rnd=$(openssl rand -hex 6)
          tag="${{ steps.get_release.outputs.release_id }}-${rnd}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Save chart to OCI
        run: |
          owner=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          repo=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          chart_ref="ghcr.io/${owner}/${repo}:${{ steps.tag.outputs.tag }}"
          echo "Saving chart as $chart_ref"
          helm chart save ./helm/bug-tracker "$chart_ref"

      - name: Push chart to GHCR
        run: |
          owner=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          repo=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          chart_ref="ghcr.io/${owner}/${repo}:${{ steps.tag.outputs.tag }}"
          echo "Pushing chart $chart_ref"
          helm chart push "$chart_ref"

      - name: Output pushed chart reference
        run: |
          echo "Chart pushed to: ghcr.io/${GITHUB_REPOSITORY}:${{ steps.tag.outputs.tag }}"
