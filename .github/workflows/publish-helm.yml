name: Publish Helm Chart to GHCR

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: helm/bug-tracker
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: nimesha-premaraja
  REGISTRY_USERNAME: Nimesha-Premaraja

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Calculate chart version
        id: chart_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag=$(gh release view --json tagName --jq '.tagName')
          base_version="${release_tag#v}"

          if ! [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest release tag must be a semantic version like v1.2.3 or 1.2.3, got: $release_tag"
            exit 1
          fi

          random_hash=$(openssl rand -hex 4)
          chart_version="${base_version}+${random_hash}"
          oci_tag="${base_version}_${random_hash}"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "oci_tag=$oci_tag" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: |
          mkdir -p .helm-packages
          helm package "$CHART_DIR" \
            --version "${{ steps.chart_version.outputs.chart_version }}" \
            --app-version "${{ steps.chart_version.outputs.release_tag }}" \
            --destination .helm-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Push chart to GHCR
        run: |
          chart_package=$(ls .helm-packages/*.tgz)
          helm push "$chart_package" "oci://$REGISTRY/$REGISTRY_NAMESPACE"
          echo "Published chart: oci://$REGISTRY/$REGISTRY_NAMESPACE/bug-tracker:${{ steps.chart_version.outputs.oci_tag }}"
