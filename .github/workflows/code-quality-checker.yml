name: Code Quality

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install quality tools
        run: python -I -m pip install --upgrade ruff

      - name: Run Ruff lint checks
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format=github > ruff-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Python syntax checks
        id: syntax
        continue-on-error: true
        run: |
          set +e
          python -I -m compileall -q app config.py wsgi.py > syntax-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build code quality report
        id: report
        env:
          RUFF_STATUS: ${{ steps.ruff.outputs.exit_code }}
          SYNTAX_STATUS: ${{ steps.syntax.outputs.exit_code }}
        run: |
          python -I <<'PY'
          import os
          from pathlib import Path

          marker_start = '<!-- python-code-quality:start -->'
          marker_end = '<!-- python-code-quality:end -->'

          checks = [
              ('Ruff lint', os.environ['RUFF_STATUS'], Path('ruff-report.txt')),
              ('Python syntax compile', os.environ['SYNTAX_STATUS'], Path('syntax-report.txt')),
          ]

          lines = [
              marker_start,
              '## Python Code Quality',
              '',
              '| Check | Result | Details |',
              '| --- | --- | --- |',
          ]

          failed = False
          for name, status, report_path in checks:
              passed = status == '0'
              failed = failed or not passed
              result = 'Passed' if passed else 'Failed'
              details = 'No issues found.' if passed else f'See `{report_path.name}` summary below.'
              lines.append(f'| {name} | {result} | {details} |')

          lines.extend(['', '### Details', ''])

          for name, status, report_path in checks:
              content = report_path.read_text(errors='replace').strip()
              if not content:
                  content = 'No output.'
              if len(content) > 3500:
                  content = content[:3500] + '\n... output truncated. See workflow logs for full details.'
              lines.extend([
                  f'<details><summary>{name}</summary>',
                  '',
                  '```text',
                  content,
                  '```',
                  '',
                  '</details>',
                  '',
              ])

          lines.extend([
              f'Workflow run: {os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              marker_end,
          ])

          Path('code-quality-report.md').write_text('\n'.join(lines) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'failed={str(failed).lower()}\n')
          PY

      - name: Update pull request body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python -I <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          marker_start = '<!-- python-code-quality:start -->'
          marker_end = '<!-- python-code-quality:end -->'
          report = Path('code-quality-report.md').read_text()

          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']

          result = subprocess.run(
              ['gh', 'api', f'repos/{repo}/pulls/{pr_number}', '--jq', '.body // ""'],
              check=True,
              text=True,
              capture_output=True,
          )
          body = result.stdout.rstrip('\n')

          start = body.find(marker_start)
          end = body.find(marker_end)
          if start != -1 and end != -1 and end > start:
              end += len(marker_end)
              updated_body = body[:start].rstrip() + '\n\n' + report + body[end:].lstrip('\n')
          elif body:
              updated_body = body.rstrip() + '\n\n' + report
          else:
              updated_body = report

          subprocess.run(
              [
                  'gh',
                  'api',
                  f'repos/{repo}/pulls/{pr_number}',
                  '--method',
                  'PATCH',
                  '--input',
                  '-',
              ],
              input=json.dumps({'body': updated_body}),
              check=True,
              text=True,
          )
          PY

      - name: Fail when quality checks fail
        if: steps.report.outputs.failed == 'true'
        run: exit 1
