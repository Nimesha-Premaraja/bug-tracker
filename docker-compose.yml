version: '3.8'

services:
  db:
    image: postgres:16
    container_name: bugtracker-db
    environment:
      POSTGRES_USER: buguser
      POSTGRES_PASSWORD: bugpass
      POSTGRES_DB: bugtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buguser -d bugtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bugtracker-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      FLASK_APP: wsgi.py
      SECRET_KEY: dev-secret-key-change-in-production
      DATABASE_URL: postgresql://buguser:bugpass@db:5432/bugtracker
      LOG_LEVEL: INFO
      GUNICORN_WORKERS: 1
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./app/uploads:/app/app/uploads

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: bugtracker-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: bugtracker-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: bugtracker-filebeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
      web:
        condition: service_started
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data

volumes:
  postgres_data:
  elasticsearch_data:
  filebeat_data:
